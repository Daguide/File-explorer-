name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish (exe unique, nécessite le runtime .NET 8 Desktop)
        run: dotnet publish src/LiteExplorer/LiteExplorer.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: LiteExplorer-win-x64
          path: out/LiteExplorer.exe
